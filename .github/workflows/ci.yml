name: Verify synthetic UR demo
on: [push, pull_request]
jobs:
  unit-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - run: npm ci
      - run: node scripts/verify-deployment-config.mjs
      - run: npm test
      - run: npm run test:policy-correctness
      - run: npm run test:denial-correctness
      - run: npm run prepare:readiness
      - run: npm run prepare:submission
      - run: npm run build
      - run: npm run build:preview
      - run: node scripts/verify-preview.mjs
      - run: npm audit --omit=dev --audit-level=high
